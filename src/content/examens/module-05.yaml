module: "05"
titre: Examen du module 5 — Systèmes de jeu
description: Leaderstats, sauvegarde fiable, inventaire, interfaces, animations et tweens. Réussis au moins 70 % pour débloquer le badge du module.
seuil: 70
questions:
  - type: qcm
    question: Tu veux afficher l’étape et les pièces de chaque joueur dans le tableau des scores. Quelle approche est correcte ?
    options:
      - texte: Un LocalScript dans StarterPlayerScripts qui crée un dossier `leaderstats` dans le joueur local
      - texte: Un Script dans ServerScriptService qui crée, à `PlayerAdded`, un dossier `leaderstats` contenant des `IntValue`
        correct: true
      - texte: Un Folder `leaderstats` posé à la main dans Workspace
    explication: "Les leaderstats se créent côté serveur, dans chaque joueur, à son arrivée. Créées par un LocalScript, elles n’existeraient que sur ce client : ni le serveur, ni les autres joueurs, ni la sauvegarde ne les verraient."

  - type: trouve-le-bug
    question: "Dans l’Obby des Nuages, `Etape` contient le numéro du dernier checkpoint validé, et un checkpoint N n’est accepté que si N vaut Etape + 1. Ce code (raccourci : la vérification de distance du module 4 a été retirée) laisse pourtant les joueurs sauter des étapes. Où est le bug ?"
    code: |
      local Players = game:GetService("Players")
      local checkpoint = script.Parent
      local numero = tonumber(checkpoint.Name)

      checkpoint.Touched:Connect(function(autrePartie)
      	local player = Players:GetPlayerFromCharacter(autrePartie.Parent)
      	local leaderstats = player and player:FindFirstChild("leaderstats")
      	local etape = leaderstats and leaderstats:FindFirstChild("Etape")
      	if etape and etape:IsA("IntValue") and numero and numero > etape.Value then
      		etape.Value = numero
      	end
      end)
    options:
      - texte: "Ligne 3 : `tonumber` ne fonctionne pas sur le nom d’une Part"
      - texte: "Ligne 6 : `GetPlayerFromCharacter` attend la Part touchée, pas son parent"
      - texte: "Ligne 9 : la condition accepte n’importe quel checkpoint plus loin, au lieu de `numero == etape.Value + 1`"
        correct: true
      - texte: "Ligne 10 : il faut écrire `etape = numero`"
    explication: "Avec `numero > etape.Value`, un joueur qui touche le checkpoint 10 en étant à l’étape 2 est accepté. La règle du projet est `numero == etape.Value + 1`. Les autres lignes sont correctes : `tonumber(\"3\")` renvoie 3 et `GetPlayerFromCharacter` attend bien le modèle du personnage."

  - type: qcm
    question: À quels moments notre système de la leçon 2 sauvegarde-t-il les données d’un joueur ? (plusieurs réponses possibles)
    options:
      - texte: Quand le joueur quitte la partie (`PlayerRemoving`)
        correct: true
      - texte: Quand le serveur s’arrête (`game:BindToClose`)
        correct: true
      - texte: Régulièrement, grâce à une sauvegarde automatique
        correct: true
      - texte: À chaque pièce ramassée
    explication: "On charge une fois, on garde en mémoire, et on sauvegarde au départ, à la fermeture et régulièrement (un filet de sécurité). Sauvegarder à chaque pièce gaspillerait le budget de requêtes par minute du serveur."

  - type: vrai-faux
    question: "La fonction passée à `UpdateAsync` peut contenir un `task.wait(1)` pour laisser le temps à d’autres serveurs de finir."
    reponse: false
    explication: "La documentation est formelle : la fonction de transformation d’`UpdateAsync` ne doit pas attendre (pas de `task.wait`, pas d’appel réseau). Elle peut aussi être rappelée plusieurs fois si la clé a changé entre-temps."

  - type: qcm
    question: "Dans la fonction passée à `UpdateAsync`, que se passe-t-il si tu renvoies `nil` ?"
    options:
      - texte: La clé est supprimée du DataStore
      - texte: L’écriture est annulée et la valeur stockée ne change pas
        correct: true
      - texte: La valeur `nil` remplace les données du joueur
    explication: "Renvoyer `nil` annule l’écriture. Notre code s’en sert pour ne pas écraser une sauvegarde créée par une version plus récente du jeu (champ `version` plus grand)."

  - type: trouve-le-bug
    question: "Ce code de sauvegarde semble marcher, mais des joueurs perdent toute leur progression après avoir changé de pseudo. Quelle ligne est en cause ?"
    code: |
      local function sauvegarder(player, donnees)
      	local cle = "Joueur_" .. player.Name
      	local succes, erreur = pcall(function()
      		return magasin:UpdateAsync(cle, function(ancienne)
      			return donnees, { player.UserId }
      		end)
      	end)
      	if not succes then
      		warn("Sauvegarde impossible :", erreur)
      	end
      end
    options:
      - texte: "Ligne 2 : la clé utilise le nom du joueur, qui peut changer ; il faut `player.UserId`"
        correct: true
      - texte: "Ligne 3 : `pcall` est inutile avec `UpdateAsync`"
      - texte: "Ligne 5 : la fonction doit renvoyer `ancienne`"
      - texte: "Ligne 9 : il faut utiliser `print` au lieu de `warn`"
    explication: "Un joueur peut changer de nom d’utilisateur : sa nouvelle clé pointe alors vers une sauvegarde vide. La documentation recommande des clés construites à partir d’identifiants stables, comme le `UserId`. Le `pcall` est indispensable, et renvoyer `donnees` est voulu."

  - type: qcm
    question: Ton jeu est en ligne depuis un mois. Pour ajouter un champ `victoires`, un ami te conseille de renommer le DataStore `DonneesJoueurs_v1` en `DonneesJoueurs_v2`. Quelle est la conséquence ?
    options:
      - texte: Aucune, Roblox copie automatiquement les anciennes données
      - texte: Le nouveau DataStore est vide, donc tous les joueurs repartent de zéro
        correct: true
      - texte: Les deux DataStores fusionnent
    explication: "Un nouveau nom désigne un nouveau DataStore, vide. Pour faire évoluer la structure, on garde le même DataStore et on complète les anciennes sauvegardes (champ `version` et fonction `completer`)."

  - type: qcm
    question: Pour acheter une traînée, que doit envoyer le client au serveur via `AcheterObjet` ?
    options:
      - texte: L’identifiant de l’objet, le prix et son nouveau solde
      - texte: Uniquement l’identifiant de l’objet
        correct: true
      - texte: Rien, le serveur devine l’objet voulu
    explication: "Le client n’envoie que ce qu’il veut. Le serveur vérifie le type, l’existence de l’objet dans son catalogue, la possession et le solde, puis prend le prix dans son propre `Catalogue`. Un prix ou un solde envoyé par le client pourrait être truqué."

  - type: vrai-faux
    question: Comme le ModuleScript `Catalogue` est dans ReplicatedStorage, un exploiteur peut baisser les prix pour tout le monde en modifiant sa copie du module.
    reponse: false
    explication: "Chaque côté a sa propre copie du module en mémoire. Un client qui modifie la sienne ne change que l’affichage chez lui ; le serveur continue d’utiliser ses propres prix pour décider."

  - type: qcm
    question: Pourquoi régler `ResetOnSpawn = false` sur le ScreenGui de l’Obby des Nuages ?
    options:
      - texte: Pour que l’interface s’affiche aussi sur les autres joueurs
      - texte: Pour que l’interface ne soit pas supprimée et recréée à chaque réapparition du personnage
        correct: true
      - texte: Pour que l’interface soit sauvegardée dans le DataStore
    explication: "Avec `ResetOnSpawn = true` (valeur par défaut), le ScreenGui est recopié à chaque réapparition. Dans un obby où l’on tombe souvent, la boutique se refermerait et les scripts redémarreraient sans arrêt."

  - type: qcm
    question: "Avec `AnchorPoint = (1, 1)` et `Position = {1, 0}, {1, 0}`, où se place un bouton ?"
    options:
      - texte: Au centre de l’écran
      - texte: Collé dans le coin inférieur droit de son conteneur
        correct: true
      - texte: Dans le coin supérieur gauche
      - texte: En dehors de l’écran, en bas à droite
    explication: "La Position `{1, 0}, {1, 0}` désigne le coin inférieur droit du conteneur, et l’AnchorPoint `(1, 1)` indique que c’est le coin inférieur droit du bouton qui s’y place. Avec un AnchorPoint `(0, 0)`, le bouton sortirait de l’écran."

  - type: qcm
    question: Tu colles dans ton jeu l’identifiant d’une animation publiée par un autre créateur, qui ne te l’a pas partagée. Que se passe-t-il ?
    options:
      - texte: Elle fonctionne, toutes les animations sont publiques
      - texte: Elle ne se charge pas, car ton jeu n’a pas la permission d’utiliser cet asset
        correct: true
      - texte: Elle fonctionne, mais seulement en R6
    explication: "Depuis l’annonce du 31 juillet 2025, les animations sont des assets « Restricted » : un jeu ne peut charger que les animations pour lesquelles il a reçu la permission (par leur propriétaire, ou automatiquement quand quelqu’un qui a le droit de les partager les utilise dans Studio)."

  - type: qcm
    question: "Un développeur appelle `animator:LoadAnimation(animation)` à chaque clic sur un bouton, puis `:Play()`. Pourquoi est-ce une mauvaise idée ?"
    options:
      - texte: Parce que `LoadAnimation` crée une nouvelle piste à chaque appel ; mieux vaut charger une fois et réutiliser la piste
        correct: true
      - texte: Parce que `LoadAnimation` ne fonctionne qu’une seule fois par partie
      - texte: Parce qu’il faut utiliser `Humanoid:LoadAnimation`
    explication: "La référence API précise que `LoadAnimation` crée toujours une nouvelle `AnimationTrack`, ce qui peut peser sur les performances. On charge l’animation une fois et on rappelle `Play` sur la même piste. `Humanoid:LoadAnimation` est dépréciée."

  - type: qcm
    question: Quel `TweenInfo` décrit une plateforme qui met 4 secondes à monter, redescend, et recommence sans fin, avec des départs et arrivées en douceur ?
    options:
      - texte: "`TweenInfo.new(4, Enum.EasingStyle.Sine, Enum.EasingDirection.InOut, -1, true)`"
        correct: true
      - texte: "`TweenInfo.new(4, Enum.EasingStyle.Sine, Enum.EasingDirection.InOut, 0, false)`"
      - texte: "`TweenInfo.new(-1, true, 4, Enum.EasingStyle.Sine)`"
    explication: "Ordre des paramètres : durée (4), style (Sine), direction (InOut), répétitions (-1 = à l’infini), aller-retour (true), puis délai (0 par défaut). La deuxième option ne joue qu’un seul aller ; la troisième mélange l’ordre."

  - type: vrai-faux
    question: "L’événement `Completed` d’un tween se déclenche aussi quand on appelle `tween:Pause()`."
    reponse: false
    explication: "D’après la référence API, `Completed` se déclenche quand le tween se termine ou est annulé avec `Cancel` (il reçoit alors l’état correspondant), mais pas lors d’une pause."

  - type: ameliore-le-prompt
    question: "Les sauvegardes de fin de partie se perdent parfois quand un serveur ferme. Tu demandes à Claude Code de corriger ça. Quelle version du prompt donnera le meilleur résultat ?"
    prompt: "fais que la sauvegarde marche quand le serveur ferme"
    options:
      - texte: "Dans GestionJoueurs, ajoute game:BindToClose qui sauvegarde chaque joueur de Players:GetPlayers(), l’un après l’autre, avec SetAsync."
      - texte: "Rends la sauvegarde 100 % fiable à la fermeture du serveur, quoi qu’il arrive."
      - texte: |
          Dans src/ServerScriptService/DonneesJoueurs.luau, ajoute SauvegarderTout() : elle lance en parallèle (task.spawn) Sauvegarder pour chaque session en mémoire (pas Players:GetPlayers()), puis attend que le compteur sauvegardesEnCours revienne à 0, pendant 25 secondes au maximum (Roblox n’attend que 30 s).
          Dans GestionJoueurs.server.luau, game:BindToClose appelle SauvegarderTout, sauf dans Studio si SAUVEGARDER_EN_STUDIO vaut false.
          Ne modifie ni Charger ni Sauvegarder.
          Vérification : sur ma copie de test, avec SAUVEGARDER_EN_STUDIO à true, mes pièces sont retrouvées après l’arrêt du test.
        correct: true
      - texte: "Ajoute à la fin de BindToClose une boucle while true do task.wait() end pour laisser au serveur tout le temps nécessaire."
    explication: "La bonne version reprend les trois précautions de la leçon : sauvegardes en parallèle, parcours des sessions en mémoire (les joueurs ont pu quitter la liste) et attente plafonnée sous les 30 secondes. Elle protège aussi le code qui marche déjà. La première sauvegarde lentement, rate des joueurs et utilise `SetAsync`. La quatrième ne sert à rien : Roblox arrête le serveur au bout de 30 secondes quoi qu’il arrive."

  - type: trouve-le-bug
    question: "Trouve la faille dans ce code généré par IA. Une IA a ajouté un bonus de 100 pièces pour la victoire. Dans la leçon, le RemoteEvent `Victoire` va seulement du serveur vers le client. Où est la faille ?"
    code: |
      local Players = game:GetService("Players")
      local ReplicatedStorage = game:GetService("ReplicatedStorage")
      local victoire = ReplicatedStorage:WaitForChild("Remotes"):WaitForChild("Victoire") :: RemoteEvent
      local BONUS_VICTOIRE = 100
      local recompenses: { [Player]: boolean } = {}
      victoire.OnServerEvent:Connect(function(player: Player)
      	local leaderstats = player:FindFirstChild("leaderstats")
      	local pieces = leaderstats and leaderstats:FindFirstChild("Pieces")
      	if pieces and pieces:IsA("IntValue") and not recompenses[player] then
      		recompenses[player] = true
      		pieces.Value += BONUS_VICTOIRE
      	end
      end)
      Players.PlayerRemoving:Connect(function(player: Player)
      	recompenses[player] = nil
      end)
    options:
      - texte: "Ligne 6 : le serveur donne le bonus dès que le client dit « j’ai gagné », sans vérifier que son `Etape` vaut le numéro du dernier checkpoint"
        correct: true
      - texte: "Ligne 9 : la table `recompenses` empêche les joueurs honnêtes de recevoir leur bonus"
      - texte: "Ligne 11 : il faut écrire `pieces.Value = BONUS_VICTOIRE`"
      - texte: "Ligne 15 : vider la table au départ du joueur fait perdre son bonus"
    explication: "N’importe quel client peut appeler `victoire:FireServer()` dès son arrivée et empocher 100 pièces, sans avoir joué. La victoire doit être décidée par le serveur, d’après `Etape`, comme dans le Script « Victoire » de la leçon. La table `recompenses` limite bien le bonus à une fois par session, et son nettoyage à `PlayerRemoving` évite qu’elle grossisse sans fin."

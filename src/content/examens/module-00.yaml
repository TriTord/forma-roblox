module: "00"
titre: Examen du module 0
description: Vérifie que tu as compris comment fonctionne Roblox côté créateurs, comment les jeux sont découverts, la méthode pour finir un jeu et le projet de l’Obby des Nuages.
seuil: 70
questions:
  - type: qcm
    question: "Ta sœur te demande ce que tu dois avoir pour suivre la formation dès le module 1. Quelle réponse est correcte ?"
    options:
      - texte: Une tablette avec l’application Roblox suffit
      - texte: "Un ordinateur sous Windows ou macOS pour installer Roblox Studio, et un compte Roblox"
        correct: true
      - texte: Une console de jeu et une manette
      - texte: Un abonnement Premium obligatoire
    explication: "Roblox Studio est une application gratuite pour **Windows et Mac**. On peut jouer sur tablette ou console, mais pour créer, il faut un ordinateur. Aucun abonnement n’est nécessaire pour apprendre et construire."

  - type: vrai-faux
    question: "Tu as terminé dix leçons sur l’ordinateur familial. En ouvrant le site sur ton téléphone, tu retrouveras automatiquement cette progression."
    reponse: false
    explication: "La progression de la formation est enregistrée dans le **navigateur** de l’appareil utilisé. Elle ne se synchronise pas entre appareils et n’est pas liée à ton compte Roblox."

  - type: qcm
    question: "Tu veux voir les statistiques de ton jeu publié et demander un paiement DevEx. Où vas-tu ?"
    options:
      - texte: Dans le Marketplace
      - texte: Dans le Creator Store
      - texte: Dans le Creator Dashboard du Creator Hub
        correct: true
      - texte: Dans la fenêtre Output de Studio
    explication: "Le **Creator Dashboard** (create.roblox.com) centralise tes créations, leurs statistiques, la monétisation et DevEx. Le Marketplace vend des objets d’avatar, le Creator Store des ressources pour créateurs, et l’Output affiche les messages des scripts."

  - type: qcm
    question: "Lesquelles de ces sources de revenus sont présentées officiellement par Roblox pour les créateurs de jeux ? (plusieurs réponses possibles)"
    options:
      - texte: Les Game Passes et les Developer Products vendus dans le jeu
        correct: true
      - texte: Les Creator Rewards, liés à l’engagement et aux nouveaux joueurs amenés sur Roblox
        correct: true
      - texte: Un salaire fixe versé par Roblox à chaque jeu publié
      - texte: Les abonnements offrant des avantages récurrents
        correct: true
    explication: "Roblox présente notamment les achats en jeu (Game Passes, Developer Products), les abonnements et les Creator Rewards. Il n’existe aucun revenu garanti : tout dépend de l’engagement des joueurs."

  - type: vrai-faux
    question: "D’après les chiffres publiés par Roblox (consultés en octobre 2026), la plupart des créateurs qui monétisent sur Roblox participent au programme DevEx."
    reponse: false
    explication: "Roblox indique que, parmi **les millions** de créateurs qui monétisent, un peu plus de **42 000** participent à DevEx (chiffre publié en septembre 2026). C’est une petite fraction : il faut aborder son premier jeu comme un projet d’apprentissage, sans promesse de revenus."

  - type: qcm
    question: "Ton ami a imaginé un jeu avec un monde ouvert, des clans, 50 armes et des quêtes. Il n’a encore rien de jouable après deux mois. Quel conseil lui donnes-tu ?"
    options:
      - texte: Continuer jusqu’à ce que tout soit prêt, puis publier d’un coup
      - texte: "Définir une version 1 minimale autour de la boucle de jeu, la faire tester, puis améliorer"
        correct: true
      - texte: Ajouter encore des fonctionnalités pour se démarquer
      - texte: Copier un jeu populaire pour gagner du temps
    explication: "C’est le principe du **MVP** recommandé par Roblox : une version minimale qui démontre la boucle de jeu, mise tôt entre les mains des joueurs pour obtenir des retours. Ajouter des fonctionnalités aggrave la dérive du périmètre, et copier réduit la visibilité."

  - type: qcm
    question: "Quelle est la meilleure façon de prototyper le parcours de ton obby ?"
    options:
      - texte: Modéliser d’abord des décors détaillés, puis tester les sauts à la fin
      - texte: "Poser des blocs simples sans décoration, tester et ajuster les sauts, puis embellir"
        correct: true
      - texte: Attendre d’avoir appris tout Luau avant de construire quoi que ce soit
    explication: "Un prototype doit être rapide et tester un aspect précis. Pour un obby, c’est la jouabilité des sauts. Le décor vient après : un saut frustrant reste frustrant, même joliment décoré."

  - type: qcm
    question: "Deux joueurs découvrent ton jeu : l’un via une publicité, l’autre via « Recommended for You » sur la page d’accueil. Lequel compte dans les signaux de classement de Recommended for You ?"
    options:
      - texte: Les deux
      - texte: Uniquement celui venu de la publicité, car il a coûté de l’argent
      - texte: Uniquement celui arrivé organiquement par Recommended for You
        correct: true
      - texte: Aucun des deux
    explication: "Selon la documentation officielle, le classement de Recommended for You ne repose que sur le comportement des joueurs arrivés **organiquement** par ce canal. Les joueurs venus de la publicité, de la recherche, des amis ou des réseaux sociaux sont exclus de ces signaux (ce qui n’est pas une pénalité)."

  - type: qcm
    question: "Après une mise à jour, beaucoup de nouveaux joueurs arrivés par « Recommended for You » quittent ton obby au bout de 40 secondes. Quel signal officiel est directement touché ?"
    options:
      - texte: Le first play bounce rate (taux de rebond à la première partie), un signal négatif
        correct: true
      - texte: Robux spent per user
      - texte: Intentional co-play days per user
      - texte: Aucun, seul le nombre total de visites compte
    explication: "Le **first play bounce rate** mesure les départs après une partie très courte (moins de 60 secondes, puis entre 61 et 180 secondes). C’est l’un des signaux les plus importants, et c’est un signal négatif : un taux élevé indique que les joueurs ne trouvent pas assez de raisons de rester au début de leur partie."

  - type: vrai-faux
    question: "Une vidéo affirme connaître la formule exacte de l’algorithme de recommandation de Roblox. Selon les informations publiées par Roblox, c’est forcément vrai puisque Roblox publie tous ses signaux."
    reponse: false
    explication: "Roblox publie la **liste** des signaux et leur importance relative, mais pas leur poids exact ni la formule, et prévient que les signaux évoluent. Personne à l’extérieur de Roblox ne connaît la formule : méfie-toi de ce genre de promesse."

  - type: qcm
    question: "Lequel de ces choix de page de jeu respecte les bonnes pratiques de découverte de Roblox ?"
    options:
      - texte: "Le titre « FREE ROBUX OBBY !! » pour attirer l’attention"
      - texte: Une miniature avec des dragons alors que le jeu n’en contient aucun
      - texte: Reprendre le titre et l’icône d’un obby très populaire
      - texte: "Des miniatures personnalisées et originales qui montrent le vrai parcours"
        correct: true
    explication: "Roblox demande une **miniature personnalisée** pour être éligible aux recommandations de la page d’accueil, et des visuels fidèles et originaux. Les promesses de Robux, les visuels trompeurs et les copies font partie des problèmes qui limitent l’exposition."

  - type: vrai-faux
    question: "Dans l’Obby des Nuages, les trails vendus en boutique sont purement cosmétiques."
    reponse: true
    explication: "Les trails changent l’apparence du personnage mais ne donnent aucun avantage de vitesse ou de saut. Personne ne peut acheter la victoire, ce qui rend le jeu équitable."

  - type: qcm
    question: "Quel critère ne fait PAS partie de la définition de « terminé » de la version 1 de l’Obby des Nuages ?"
    options:
      - texte: La progression est conservée d’une session à l’autre
      - texte: Le jeu a atteint 10 000 visites
        correct: true
      - texte: Aucune erreur n’apparaît dans l’Output pendant une partie complète
      - texte: Des personnes extérieures ont testé le jeu
    explication: "La définition de « terminé » ne contient que des critères **que tu contrôles**. Le nombre de visites dépend aussi de la concurrence, de la saisonnalité et des recommandations : c’est un résultat à suivre, pas une condition de fin."

  - type: trouve-le-bug
    question: "Ce script doit afficher le nom du joueur qui rejoint la partie. Il provoque une erreur dès son lancement. Où est le bug ?"
    code: |
      local Players = game:GetService("Player")

      local function surArrivee(joueur)
      	print(joueur.Name .. " vient d'arriver dans l'Obby des Nuages !")
      end

      Players.PlayerAdded:Connect(surArrivee)
    options:
      - texte: "Ligne 1 : le service s’appelle `Players` (avec un s), pas `Player`"
        correct: true
      - texte: "Ligne 4 : il faut utiliser `+` pour coller les deux textes"
      - texte: "Ligne 7 : il faut écrire `surArrivee()` avec des parenthèses"
      - texte: "Ligne 3 : une fonction ne peut pas avoir de paramètre"
    explication: "`GetService` attend le nom exact du service : `\"Players\"`. Avec `\"Player\"`, Roblox ne trouve aucun service de ce nom et le script s’arrête sur une erreur. La concaténation avec `..` est correcte, et on passe bien la fonction sans parenthèses à `Connect`."

  - type: trouve-le-bug
    question: "Ce script doit ignorer tout ce qui n’est pas un joueur quand on touche un checkpoint. Studio refuse de l’exécuter. Où est le bug ?"
    code: |
      local Players = game:GetService("Players")
      local checkpoint = script.Parent

      checkpoint.Touched:Connect(function(partieTouchee)
      	local joueur = Players:GetPlayerFromCharacter(partieTouchee.Parent)
      	if joueur = nil then
      		return
      	end
      	print(joueur.Name .. " a atteint un checkpoint")
      end)
    options:
      - texte: "Ligne 2 : `script.Parent` n’existe pas"
      - texte: "Ligne 5 : `GetPlayerFromCharacter` attend le joueur, pas le personnage"
      - texte: "Ligne 6 : pour comparer, il faut `==` ; un seul `=` sert à donner une valeur"
        correct: true
      - texte: "Ligne 7 : `return` est interdit dans une fonction connectée à un événement"
    explication: "En Luau, `=` affecte une valeur et `==` compare deux valeurs. `if joueur = nil then` est une erreur de syntaxe : le script ne démarre même pas. La bonne ligne est `if joueur == nil then`."
